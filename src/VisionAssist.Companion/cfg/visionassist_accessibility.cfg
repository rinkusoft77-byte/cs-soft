// VisionAssist - in-game readability settings
//
// These are ordinary client convars. They work on any server you join, because
// they only change how your own game draws and sounds - the server is not
// involved and has nothing to approve.
//
// Load it from the console:
//   exec visionassist_accessibility
//
// To have it applied every launch, add that same line to
//   ...\game\csgo\cfg\autoexec.cfg
//
// Every value below is a starting point, not a rule. Change what does not suit
// you; a setting that fights your eyes is worse than the default.
//
// If a line prints "Unknown command" in the console, that convar was renamed or
// removed by a game update. Nothing breaks - the game skips it and carries on
// with the rest of the file. Tell us which line it was so it can be corrected.

echo "[VisionAssist] applying readability settings..."

// ---------------------------------------------------------------- radar
// A radar zoomed in on you, drawn larger, with bigger dots. The default radar
// is small and the icons are tiny.

cl_radar_scale 0.4
cl_radar_always_centered 0
cl_hud_radar_scale 1.3
cl_radar_icon_scale_min 0.6
cl_radar_rotate 1

// ---------------------------------------------------------------- HUD
// 0.95 is the largest HUD the game allows.

hud_scaling 0.95

// ---------------------------------------------------------------- crosshair
// Thick, bright, and magenta - a colour almost nothing in the maps uses, so the
// crosshair does not disappear into sand, concrete or foliage.

cl_crosshairstyle 4
cl_crosshairsize 4
cl_crosshairthickness 1.6
cl_crosshair_outlinethickness 1
cl_crosshairgap -2
cl_crosshaircolor 5
cl_crosshaircolor_r 255
cl_crosshaircolor_g 0
cl_crosshaircolor_b 255
cl_crosshairalpha 255
cl_crosshairdot 1

echo "[VisionAssist] done. Sound and caption options are in Settings > Audio."

// ---------------------------------------------------------------- worth checking by hand
//
// The settings below help a lot but their convar names have moved between CS:GO
// and CS2 updates, so they are left commented out rather than guessed at. Check
// a name before using it by typing this in the console:
//
//   find closecaption
//   find snd_
//
// If the console lists the convar, it exists in your build and you can move the
// line above this block.
//
// Subtitles / closed captions - the game's own sound-to-text. Easier to set from
// Settings > Audio, where it is a dropdown:
// closecaption 1
//
// Colour-coded teammates: each one keeps a fixed colour on the radar and above
// their head instead of everyone being the same green, which also means anyone
// WITHOUT a colour is an enemy. Worth having, but the convar was renamed
// somewhere between CS:GO and CS2, so check which one your build has:
//
//   find teammate
//   find teamid
//
// In CS:GO this was cl_teammate_colors 1. If the console does not list it, the
// same option is in the settings menu under Game - set it there instead.
// cl_teammate_colors 1
//
// HRTF (Steam Audio) sharpens left/right and front/back separation, which is
// what the sound panel in the overlay reads. It is a toggle in
// Settings > Audio > Enable HRTF - use the menu rather than a convar.
