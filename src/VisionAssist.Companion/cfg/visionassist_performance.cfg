// VisionAssist - performance settings
//
//   exec visionassist_performance
//
// Read this first, because it saves disappointment: in CS2 convars are almost
// never where the FPS is. Valve locked down or removed most of the CS:GO
// "booster" commands, and the ones that survive change a handful of frames at
// most. The real gains, in order of how much they actually matter:
//
//   1. Video settings in the game menu (resolution, MSAA, shadows, model
//      detail). Tens of FPS.
//   2. Graphics driver and Windows settings. Tens of FPS.
//   3. Launch options. A few FPS, plus faster startup.
//   4. Convars, this file. A few FPS.
//
// Steps 1-3 are written out in PERFORMANCE.md. Anything that promises hundreds
// of FPS from a .cfg is selling you something.

echo "[VisionAssist] applying performance settings..."

// ---------------------------------------------------------------- frame cap
// 0 = uncapped. An uncapped game renders as fast as it can, which gives the
// lowest input latency but also the most heat and coil whine. If your card runs
// hot, cap it slightly above your refresh rate instead: 144 Hz -> 160.

fps_max 0

// The menu does not need to run at 400 FPS while you sit in it.
fps_max_ui 120

// ---------------------------------------------------------------- drawing
// Small savings, and each one also removes something that gets in the way
// visually - which is the point of this repository.

// The freeze camera after you die: costs frames and hides the live round.
cl_disablefreezecam 1

// Bullet tracers from your own gun. Off is both cheaper and less cluttered.
r_drawtracers_firstperson 0

// Player avatars on the scoreboard and in the kill feed. 1 hides them for
// everyone but your friends, 2 hides all of them.
cl_hide_avatar_images 1

// ---------------------------------------------------------------- measuring
// Turn this on while you are testing a change, then off again. Watching a
// counter all game is a good way to stop watching the game.
//
//   cl_showfps 1        simple counter
//   cq_netgraph 1       frame timing detail

cl_showfps 0

echo "[VisionAssist] done. The big wins are in the video menu - see PERFORMANCE.md."

// ---------------------------------------------------------------- worth checking by hand
//
// These existed in CS:GO and may or may not be in your CS2 build. Check before
// using, by typing the name into the console:
//
//   find engine_no_focus_sleep
//   find snd_mixahead
//
// If the console lists it, the convar exists and you can uncomment the line.
//
// How much the game sleeps when it does not have focus. Lower = alt-tabbing
// back is quicker, at the cost of CPU while you are away.
// engine_no_focus_sleep 0
//
// Audio buffer. Smaller = sounds arrive sooner, and the sound panel in the
// overlay reacts sooner, but too small crackles.
// snd_mixahead 0.025
