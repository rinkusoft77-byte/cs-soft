// VisionAssist Companion - Game State Integration
//
// Place this file in:
//   ...\steamapps\common\Counter-Strike Global Offensive\game\csgo\cfg\
//
// The game reads it on startup, so CS2 has to be restarted after adding it.
// From then on the game POSTs your own client state to the address below.
// This is Valve's own interface, documented for scoreboard and stream overlays;
// nothing is injected and no game memory is read.
//
// Note which keys are NOT here: allplayers_id, allplayers_state,
// allplayers_position and allplayers_weapons. Those describe other players and
// the game only fills them in for spectators and GOTV. This overlay shows you
// what your own HUD already knows, so it does not ask for them.

"VisionAssist Accessibility Overlay"
{
    "uri"       "http://127.0.0.1:__PORT__/gsi"

    // Give up on a POST after this long. The overlay answers instantly, so this
    // only matters when the companion app is not running.
    "timeout"   "5.0"

    // Collect changes for 0.1 s before sending, and send at most every 0.1 s.
    // That is 10 updates a second - smooth enough for a health readout without
    // being wasteful.
    "buffer"    "0.1"
    "throttle"  "0.1"

    // Send something at least every 10 s even when nothing changes, so the
    // overlay can tell "nothing happening" from "game closed".
    "heartbeat" "10.0"

    // Must match "Token" in companion.json. It stops anything else on the
    // machine from feeding the overlay made-up state.
    "auth"
    {
        "token" "__TOKEN__"
    }

    "data"
    {
        // Game version and your SteamID64.
        "provider"            "1"

        // Map name, game mode, round number, both team scores.
        "map"                 "1"

        // freezetime / live / over, and the bomb's state.
        "round"               "1"

        // Your name, SteamID and team.
        "player_id"           "1"

        // Health, armour, helmet, flashed/smoked/burning, money, defuse kit.
        "player_state"        "1"

        // Your inventory and the ammo in the gun you are holding.
        "player_weapons"      "1"

        // Kills, assists, deaths, MVPs for the match.
        "player_match_stats"  "1"

        // Which clock is running and how many seconds are left on it. This is
        // where the round timer and the bomb fuse come from.
        "phase_countdowns"    "1"
    }
}
